spring:
  application:
    name: dsa-ladder
  # Local development talks to MongoDB on localhost (`docker compose up -d mongo`).
  # The "prod" profile (application-prod.yml) requires MONGODB_URI.
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/dsaladder}
      # Create the indexes declared on the documents at start-up.
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Folder with topics.json and the problem books (relative to the repository root).
  problems-dir: ${PROBLEMS_DIR:problems}
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  jwt-ttl-hours: 168
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  judge:
    memory-mb: 256
    max-concurrent: ${JUDGE_MAX_CONCURRENT:2}
    queue-wait-seconds: 20
    # Command prepended to every submission run, e.g. "prlimit --nproc=64 --fsize=2097152 --". Empty = none.
    sandbox-prefix: ${JUDGE_SANDBOX_PREFIX:}
    runs-per-minute: 20
    submits-per-minute: 10
    # Compile-only checks for the editor's red underlines: cheap, so the editor may ask often.
    checks-per-minute: 120
