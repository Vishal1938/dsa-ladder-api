# Local stack: MongoDB + the API on http://localhost:8080
#   cp .env.example .env && docker compose up --build
# Just the database (API from `mvn spring-boot:run`):
#   docker compose up -d mongo
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/dsaladder
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-32+-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    # Hardening for the code runner (see docs/ARCHITECTURE.md → Security model)
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1536m

volumes:
  mongodata:
