# Local stack: PostgreSQL + the API on http://localhost:8080
#   cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dsaladder
      POSTGRES_USER: dsaladder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dsaladder}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsaladder"]
      interval: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/dsaladder
      DATABASE_USER: dsaladder
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-dsaladder}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-of-32+-chars}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    # Hardening for the code runner (see docs/ARCHITECTURE.md → Security model)
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 1536m

volumes:
  pgdata:
